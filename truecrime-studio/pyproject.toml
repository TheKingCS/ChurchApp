[project]
name = "truecrime-studio"
version = "0.1.0"
description = "Research a true crime case, gather official media, write an original narrated video, and queue it for human review."
requires-python = ">=3.11"
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.7",
  "pillow>=10",
  "yt-dlp>=2025.1.1",
  "edge-tts>=6.1",
  "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["review/templates/*.html", "default_config.toml"]
