<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Review queue{% endblock %} · True Crime Studio</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1b1b1f; --muted:#666; --line:#e2e2de; --accent:#b4232c; --ok:#1f7a3f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141417; --card:#1d1d22; --ink:#ececf0; --muted:#9a9aa4; --line:#2e2e35; --accent:#e5484d; --ok:#3dbb6b; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 64px; }
  a { color:var(--accent); }
  h1 { font-size:22px; margin:0 0 16px; } h2 { font-size:17px; margin:28px 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  .muted { color:var(--muted); } .small { font-size:13px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); font-size:12px; }
  .pill.rendered { border-color:var(--accent); color:var(--accent); } .pill.approved { border-color:var(--ok); color:var(--ok); }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  .grid { display:grid; grid-template-columns: minmax(0,360px) minmax(0,1fr); gap:20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  video { width:100%; border-radius:10px; background:#000; }
  textarea { width:100%; min-height:70px; font:inherit; padding:8px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { font:inherit; padding:8px 16px; border-radius:8px; border:0; cursor:pointer; margin-right:8px; }
  .approve { background:var(--ok); color:#fff; } .reject { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .warn { border-left:3px solid var(--accent); }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
